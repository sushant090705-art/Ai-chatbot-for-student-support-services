<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | AI Student Support Portal</title>

    <!-- Google Fonts: Space Grotesk, Orbitron & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800&family=Outfit:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body>

    <!-- Cyberpunk Tech Ambient Background -->
    <div class="cyber-background">
        <div class="tech-grid"></div>
        <div class="glow-orb orb-cyan"></div>
        <div class="glow-orb orb-violet"></div>
        <div class="scanline"></div>
    </div>

    <div class="login-container">

        <div class="login-card">
            <!-- Tech Frame Corner Accents -->
            <span class="corner-bracket top-left"></span>
            <span class="corner-bracket top-right"></span>
            <span class="corner-bracket bottom-left"></span>
            <span class="corner-bracket bottom-right"></span>

            <!-- AI Emblem Header -->
            <div class="header-section">
                <div class="ai-core-badge">
                    <div class="pulse-ring"></div>
                    <svg class="ai-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="10" rx="2"></rect>
                        <circle cx="12" cy="5" r="2"></circle>
                        <path d="M12 7v4"></path>
                        <line x1="8" y1="15" x2="8.01" y2="15"></line>
                        <line x1="16" y1="15" x2="16.01" y2="15"></line>
                        <path d="M9 18h6"></path>
                    </svg>
                </div>

                <div class="system-status">
                    <span class="status-dot"></span>
                    <span class="status-text">SYSTEM ONLINE</span>
                </div>

                <h1 class="portal-title">AI STUDENT SUPPORT</h1>
                <p class="subtitle">Authenticate to access your AI Assistant</p>
            </div>

            <!-- Login Form -->
            <form method="POST" action="{{ url_for('login') }}" class="cyber-form" id="loginForm">

                <!-- Email Input Field -->
                <div class="input-group">
                    <div class="input-wrapper">
                        <span class="input-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                                <polyline points="22,6 12,13 2,6"></polyline>
                            </svg>
                        </span>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder=" "
                            autocomplete="email"
                            required
                        >
                        <label for="email">Student Email</label>
                        <span class="focus-border"></span>
                    </div>
                </div>

                <!-- Password Input Field -->
                <div class="input-group">
                    <div class="input-wrapper">
                        <span class="input-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                            </svg>
                        </span>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder=" "
                            autocomplete="current-password"
                            required
                        >
                        <label for="password">Password</label>

                        <button
                            type="button"
                            id="togglePassword"
                            class="eye-toggle-btn"
                            aria-label="Toggle password visibility"
                        >
                            <svg class="eye-icon eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                            <svg class="eye-icon eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                <line x1="1" y1="1" x2="23" y2="23"></line>
                            </svg>
                        </button>
                        <span class="focus-border"></span>
                    </div>
                </div>

                <!-- Form Options Row -->
                <div class="form-options">
                    <label class="custom-checkbox">
                        <input type="checkbox" name="remember">
                        <span class="checkbox-box">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="20 6 9 17 4 12"></polyline>
                            </svg>
                        </span>
                        <span class="checkbox-text">Remember Session</span>
                    </label>

                    <a href="#" class="forgot-link">Forgot Access?</a>
                </div>

                <!-- Cyber Submit Button -->
                <button class="cyber-btn" type="submit" id="submitBtn">
                    <span class="btn-glow"></span>
                    <span class="btn-content">
                        <span class="btn-text">INITIALIZE LOGIN</span>
                        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                            <polyline points="12 5 19 12 12 19"></polyline>
                        </svg>
                    </span>
                    <span class="btn-spinner" style="display: none;">
                        <svg class="spinner-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <circle cx="12" cy="12" r="10" stroke-dasharray="32" stroke-dashoffset="10"></circle>
                        </svg>
                        <span>AUTHENTICATING...</span>
                    </span>
                </button>

            </form>

            <!-- Divider -->
            <div class="tech-divider">
                <span>OR</span>
            </div>

            <!-- Footer Links -->
            <div class="footer-actions">
                <p class="register-prompt">
                    New Student?
                    <a href="{{ url_for('register') }}" class="cyber-link">Register Account</a>
                </p>

                <div class="back-home">
                    <a href="{{ url_for('index') }}" class="home-link">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="19" y1="12" x2="5" y2="12"></line>
                            <polyline points="12 19 5 12 12 5"></polyline>
                        </svg>
                        <span>Back to Home</span>
                    </a>
                </div>
            </div>

        </div>

    </div>

    <script src="{{ url_for('static', filename='js/login.js') }}"></script>
</body>
</html>
