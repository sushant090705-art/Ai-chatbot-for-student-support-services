<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/home.css') }}">
    <style>
        .profile-container {
            max-width: 600px;
            margin: 60px auto;
            padding: 0 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .back-btn {
            display: inline-block;
            margin-bottom: 20px;
            color: #2563eb;
            text-decoration: none;
            font-weight: 500;
        }
        .back-btn:hover {
            text-decoration: underline;
        }

        .profile-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
            overflow: hidden;
        }

        /* Top Accent Banner */
        .profile-header {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            height: 100px;
            position: relative;
        }

        /* Avatar styling */
        .avatar-container {
            width: 100px;
            height: 100px;
            background-color: #e2e8f0;
            border: 4px solid #ffffff;
            border-radius: 50%;
            position: absolute;
            bottom: -50px;
            left: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            font-weight: bold;
            color: #475569;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .profile-body {
            padding: 70px 30px 30px 30px;
        }

        .student-name {
            font-size: 1.8rem;
            font-weight: 700;
            color: #1e293b;
            margin: 0 0 5px 0;
        }

        .student-tag {
            display: inline-block;
            background-color: #e0f2fe;
            color: #0369a1;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 25px;
        }

        .info-group {
            border-top: 1px solid #f1f5f9;
            padding: 15px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .info-label {
            font-size: 0.9rem;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 500;
        }

        .info-value {
            font-size: 1.05rem;
            color: #334155;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="profile-container">
        <a href="{{ url_for('home') }}" class="back-btn">← Back to Dashboard</a>

        <div class="profile-card">
            <div class="profile-header">
                <!-- Uses the first letter of the name as a dynamic initials avatar -->
                <div class="avatar-container">
                    {{ name[0] | upper }}
                </div>
            </div>

            <div class="profile-body">
                <h1 class="student-name">{{ name }}</h1>
                <span class="student-tag">Active Student</span>

                <div class="info-group">
                    <span class="info-label">Email Address</span>
                    <span class="info-value">{{ email }}</span>
                </div>

                <div class="info-group">
                    <span class="info-label">Branch / Department</span>
                    <span class="info-value">{{ branch if branch else 'Not Specified' }}</span>
                </div>

                <div class="info-group">
                    <span class="info-label">Academic Year</span>
                    <span class="info-value">{{ year if year else 'Not Specified' }}</span>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
